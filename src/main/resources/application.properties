spring.application.name=springai-rag

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:spring_ai_rag}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:root}

spring.ai.ollama.base-url=${OLLAMA_URL:http://localhost:11434}
spring.ai.ollama.chat.options.model=${CHAT_MODEL:qwen3:0.6b}
#convierte texto a vectores numericos para que se guarden en la base de datos vectorial
spring.ai.ollama.embedding.options.model=${EMBEDDING_MODEL:nomic-embed-text}
spring.ai.vectorstore.pgvector.dimensions=768
spring.ai.vectorstore.pgvector.initialize-schema=true

#indexa vectores para que se mas rapido con el siguiente algoritmo, buscar vectores mas rapido en forma vertical, crea indice sobre la columna embedding
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.schema-name=public
spring.ai.vectorstore.pgvector.table-name=vector_store
#Operador, busca por cercania matematica <=>
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
#guarda por fragmento el documento y guarda, chunck fragmento importante de info
#proceso: pdf se envia-> se divide chunking ->cada fragmento se convierte a vectores (embeddings)-> se envia a posgtgres ->  pg executa la extencion pgvetor para q lo guarde y consultar por endpoint, chat
spring.ai.vectorstore.pgvector.max-document-batch-size=10000
